<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hub-title">
    <title id="hub-title">FLAME Hub: an analysis travels from the hub to each node, only the result comes back, the data never moves</title>

    <defs>
        <linearGradient id="hub-tile" x1="24" y1="24" x2="232" y2="232" gradientUnits="userSpaceOnUse">
            <stop stop-color="#F04A13" stop-opacity="0.14"/>
            <stop offset="1" stop-color="#F7931A" stop-opacity="0.14"/>
        </linearGradient>
        <linearGradient id="hub-edge" x1="24" y1="24" x2="232" y2="232" gradientUnits="userSpaceOnUse">
            <stop stop-color="#F04A13"/>
            <stop offset="1" stop-color="#F7931A"/>
        </linearGradient>
    </defs>

    <!-- rounded app-icon tile -->
    <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#hub-tile)"/>
    <rect x="8.75" y="8.75" width="238.5" height="238.5" rx="55.25" stroke="url(#hub-edge)" stroke-opacity="0.35" stroke-width="1.5"/>

    <!-- one spoke per node that joined the project -->
    <g stroke="#F15A29" stroke-opacity="0.4" stroke-width="2.5" stroke-dasharray="4 6" stroke-linecap="round">
        <line x1="128" y1="128" x2="62" y2="62"/>
        <line x1="128" y1="128" x2="194" y2="62"/>
        <line x1="128" y1="128" x2="194" y2="194"/>
        <line x1="128" y1="128" x2="62" y2="194"/>
    </g>

    <!-- nodes, each holding its data: the cylinders never move -->
    <g transform="translate(62 62)">
        <circle r="22" fill="#F7931A" fill-opacity="0.18"/>
        <circle r="15" fill="#F7931A"/>
        <path d="M-6 -4v8c0 1.7 2.7 3 6 3s6-1.3 6-3v-8" stroke="#FFFFFF" stroke-width="2"/>
        <ellipse cx="0" cy="-4" rx="6" ry="3" stroke="#FFFFFF" stroke-width="2"/>
    </g>
    <g transform="translate(194 62)">
        <circle r="22" fill="#F7931A" fill-opacity="0.18"/>
        <circle r="15" fill="#F7931A"/>
        <path d="M-6 -4v8c0 1.7 2.7 3 6 3s6-1.3 6-3v-8" stroke="#FFFFFF" stroke-width="2"/>
        <ellipse cx="0" cy="-4" rx="6" ry="3" stroke="#FFFFFF" stroke-width="2"/>
    </g>
    <g transform="translate(194 194)">
        <circle r="22" fill="#F7931A" fill-opacity="0.18"/>
        <circle r="15" fill="#F7931A"/>
        <path d="M-6 -4v8c0 1.7 2.7 3 6 3s6-1.3 6-3v-8" stroke="#FFFFFF" stroke-width="2"/>
        <ellipse cx="0" cy="-4" rx="6" ry="3" stroke="#FFFFFF" stroke-width="2"/>
    </g>
    <g transform="translate(62 194)">
        <circle r="22" fill="#F7931A" fill-opacity="0.18"/>
        <circle r="15" fill="#F7931A"/>
        <path d="M-6 -4v8c0 1.7 2.7 3 6 3s6-1.3 6-3v-8" stroke="#FFFFFF" stroke-width="2"/>
        <ellipse cx="0" cy="-4" rx="6" ry="3" stroke="#FFFFFF" stroke-width="2"/>
    </g>

    <!-- per node, staggered: the analysis container travels out, only a result dot comes back -->
    <g opacity="0">
        <rect x="-6" y="-6" width="12" height="12" rx="3" fill="#F04A13"/>
        <animateMotion dur="4s" begin="0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.4;1" path="M128 128L62 62"/>
        <animate attributeName="opacity" dur="4s" begin="0s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.05;0.38;0.42;1"/>
    </g>
    <g opacity="0">
        <circle r="4" fill="#F04A13" stroke="#FFFFFF" stroke-width="1.5"/>
        <animateMotion dur="4s" begin="0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5;0.85;1" path="M62 62L128 128"/>
        <animate attributeName="opacity" dur="4s" begin="0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.48;0.52;0.82;0.86;1"/>
    </g>
    <g opacity="0">
        <rect x="-6" y="-6" width="12" height="12" rx="3" fill="#F04A13"/>
        <animateMotion dur="4s" begin="1s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.4;1" path="M128 128L194 62"/>
        <animate attributeName="opacity" dur="4s" begin="1s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.05;0.38;0.42;1"/>
    </g>
    <g opacity="0">
        <circle r="4" fill="#F04A13" stroke="#FFFFFF" stroke-width="1.5"/>
        <animateMotion dur="4s" begin="1s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5;0.85;1" path="M194 62L128 128"/>
        <animate attributeName="opacity" dur="4s" begin="1s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.48;0.52;0.82;0.86;1"/>
    </g>
    <g opacity="0">
        <rect x="-6" y="-6" width="12" height="12" rx="3" fill="#F04A13"/>
        <animateMotion dur="4s" begin="2s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.4;1" path="M128 128L194 194"/>
        <animate attributeName="opacity" dur="4s" begin="2s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.05;0.38;0.42;1"/>
    </g>
    <g opacity="0">
        <circle r="4" fill="#F04A13" stroke="#FFFFFF" stroke-width="1.5"/>
        <animateMotion dur="4s" begin="2s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5;0.85;1" path="M194 194L128 128"/>
        <animate attributeName="opacity" dur="4s" begin="2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.48;0.52;0.82;0.86;1"/>
    </g>
    <g opacity="0">
        <rect x="-6" y="-6" width="12" height="12" rx="3" fill="#F04A13"/>
        <animateMotion dur="4s" begin="3s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.4;1" path="M128 128L62 194"/>
        <animate attributeName="opacity" dur="4s" begin="3s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.05;0.38;0.42;1"/>
    </g>
    <g opacity="0">
        <circle r="4" fill="#F04A13" stroke="#FFFFFF" stroke-width="1.5"/>
        <animateMotion dur="4s" begin="3s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5;0.85;1" path="M62 194L128 128"/>
        <animate attributeName="opacity" dur="4s" begin="3s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.48;0.52;0.82;0.86;1"/>
    </g>

    <!-- the hub -->
    <circle cx="128" cy="128" r="34" fill="#F04A13" fill-opacity="0.14"/>
    <g transform="translate(108.5 101) scale(0.125)">
        <path fill="#F04A13" d="M155 10C140 75 85 125 53 185C19.4 248 58 411 155 411C252 411 290.6 248 257 185C225 125 170 75 155 10Z"/>
        <path fill="#F15A29" d="M155 10C145 75 105 128 80 185C55 242 68 340 155 411C100 345 88 262 108 198C128 134 150 75 155 10Z"/>
        <path fill="#F7931A" d="M155 140C180 200 220 245 220 305C220 360 198 405 155 405C112 405 90 360 90 305C90 245 130 200 155 140Z"/>
        <path fill="#FFFFFF" d="M155 235C172 275 192 300 192 340C192 378 175 400 155 400C135 400 118 378 118 340C118 300 138 275 155 235Z"/>
    </g>
</svg>
